site_name: Repo-native project memory
site_description: "The repository is the project memory: plain files, versioned by Git, for humans and coding agents. One directory was missing — the why — and it can be repo-native too."
site_url: https://oliver-zehentleitner.github.io/repo-native-project-memory/
repo_url: https://github.com/oliver-zehentleitner/repo-native-project-memory
repo_name: oliver-zehentleitner/repo-native-project-memory

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - content.code.copy

plugins:
  - search
  - include-markdown

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences

copyright: '<a href="https://keepthewhy.com/imprint/">Imprint</a> · <a href="https://github.com/oliver-zehentleitner/repo-native-project-memory/blob/main/LICENSE">License</a>'

nav:
  - Thesis: index.md
  - Keep the Why (the practice): https://keepthewhy.com
  - "Why this page is built this way": https://github.com/oliver-zehentleitner/repo-native-project-memory/tree/main/context
